<title data-keep>Popz Walks</title>
<meta data-keep name="claude:viewport-fit-sides" content="cover">
<link data-keep rel="preconnect" href="https://fonts.googleapis.com">
<link data-keep rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link data-keep rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Saira+Extra+Condensed:wght@500;700;800&display=swap">
<style data-keep>
/* Layout: Lions game-day scoreboard. Dark field, Honolulu Blue + Silver, helmet stripe under the header; summary first, scouting report, film (chart), box score (log). */
:root {
  color-scheme: dark;
  --ink: #090d12;          /* page: Lions black */
  --panel: #111922;
  --panel-2: #172230;
  --line: #233140;
  --fg: #f3f6f8;
  --muted: #93a0ab;
  --blue: #0076b6;         /* Honolulu Blue */
  --blue-hi: #39a6e6;      /* Honolulu Blue lifted for text on dark */
  --silver: #b0b7bc;       /* Lions Silver */
  --good: #4cc38a;
  --warn: #f2b544;
  --bad: #f2706a;
  --f-display: "Saira Extra Condensed", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
}
body { background: var(--ink); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.pw-wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 56px; display: grid; gap: 28px; }
.pw-wrap * { box-sizing: border-box; }
.pw-num { font-variant-numeric: tabular-nums; }

/* Header */
.pw-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.pw-eyebrow { font-family: var(--f-display); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--blue-hi); font-size: 15px; }
.pw-title { font-family: var(--f-display); font-weight: 800; font-size: clamp(52px, 11vw, 96px); line-height: .86; letter-spacing: .01em; margin: 4px 0 0; text-transform: uppercase; text-wrap: balance; }
.pw-title span { color: var(--blue-hi); }
.pw-sub { color: var(--muted); margin: 8px 0 0; max-width: 60ch; }
.pw-stripe { height: 10px; border-radius: 2px; background: linear-gradient(to bottom, var(--silver) 0 3px, var(--blue) 3px 7px, var(--silver) 7px 10px); opacity: .9; }
.pw-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pw-btn { font: 600 15px/1 var(--f-body); border-radius: 999px; padding: 12px 18px; border: 1px solid var(--blue); background: var(--blue); color: #fff; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.pw-btn:hover { background: #0a86cc; }
.pw-btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.pw-btn.ghost:hover { border-color: var(--silver); }
.pw-btn.small { padding: 7px 12px; font-size: 13px; }
.pw-btn:disabled { opacity: .5; cursor: default; }
.pw-btn:focus-visible, .pw-link:focus-visible, .pw-drop:focus-within { outline: 2px solid var(--blue-hi); outline-offset: 2px; }
.pw-chip { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; }

/* Section headings */
.pw-h2 { font-family: var(--f-display); font-weight: 700; font-size: 30px; letter-spacing: .03em; text-transform: uppercase; margin: 0; line-height: 1; }
.pw-h2 small { display: block; font-family: var(--f-body); font-size: 14px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); margin-top: 6px; }
.pw-sec { display: grid; gap: 14px; }

/* Latest walk scoreboard */
.pw-board { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.pw-board-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; padding: 14px 18px; background: var(--blue); color: #fff; }
.pw-board-top b { font-family: var(--f-display); font-size: 24px; letter-spacing: .05em; text-transform: uppercase; }
.pw-board-top span { font-weight: 600; opacity: .92; }
.pw-board-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.pw-stat { padding: 16px 18px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: grid; gap: 2px; align-content: start; min-width: 0; }
.pw-stat-label { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.pw-stat-val { font-family: var(--f-display); font-weight: 700; font-size: 44px; line-height: 1; }
.pw-stat-val small { font-size: 20px; color: var(--muted); margin-left: 3px; font-weight: 500; }
.pw-delta { font-size: 13px; font-weight: 600; }
.pw-delta.good { color: var(--good); } .pw-delta.bad { color: var(--bad); } .pw-delta.flat { color: var(--muted); }
.pw-board-foot { padding: 12px 18px; color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px 18px; }
.pw-board-foot b { color: var(--fg); font-weight: 600; }

/* Season totals */
.pw-totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.pw-tile { border-top: 3px solid var(--blue); background: var(--panel); padding: 14px 16px 16px; border-radius: 0 0 10px 10px; display: grid; gap: 2px; min-width: 0; }
.pw-tile .pw-stat-val { font-size: 40px; }
.pw-tile p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }

/* Scouting report */
.pw-scout { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; align-items: start; }
.pw-col { background: var(--panel); border-radius: 12px; padding: 16px 18px; display: grid; gap: 12px; min-width: 0; }
.pw-col h3 { margin: 0; display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 22px; letter-spacing: .06em; text-transform: uppercase; }
.pw-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.pw-col ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.pw-col li { display: grid; gap: 2px; padding-top: 12px; border-top: 1px solid var(--line); }
.pw-col li:first-child { border-top: 0; padding-top: 0; }
.pw-col li b { font-weight: 600; }
.pw-col li span { color: var(--muted); font-size: 14px; }

/* Field (pace chart) */
.pw-field { background: var(--panel); border-radius: 12px; padding: 14px 10px 8px; position: relative; }
.pw-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 0 8px 8px; font-size: 13px; color: var(--muted); }
.pw-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.pw-legend i.line { width: 16px; height: 0; border-radius: 0; border-top: 2px dashed var(--blue-hi); vertical-align: 3px; }
.pw-legend i.goal { width: 16px; height: 0; border-radius: 0; border-top: 2px dashed var(--good); vertical-align: 3px; }
#pw-chart { width: 100%; }
#pw-chart svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
.pw-tip { position: absolute; pointer-events: none; background: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.35; min-width: 150px; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
.pw-tip b { display: block; font-family: var(--f-display); font-size: 18px; letter-spacing: .03em; }
.pw-tip span { color: var(--muted); }

/* Two-up cards */
.pw-two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.pw-card { background: var(--panel); border-radius: 12px; padding: 16px 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.pw-card h3 { margin: 0; font-family: var(--f-display); font-size: 22px; letter-spacing: .05em; text-transform: uppercase; }
.pw-card > p { margin: 0; color: var(--muted); font-size: 14px; }
.pw-bar-row { display: grid; grid-template-columns: 92px 1fr 64px; align-items: center; gap: 10px; font-size: 14px; }
.pw-bar-row .lab { color: var(--muted); }
.pw-bar-row .val { text-align: right; font-weight: 600; }
.pw-bar { height: 14px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.pw-bar i { display: block; height: 100%; background: var(--blue); border-radius: 3px; }
.pw-bar i.silver { background: var(--silver); }
.pw-big-diff { font-family: var(--f-display); font-size: 40px; font-weight: 700; line-height: 1; color: var(--blue-hi); }

/* Trophy case */
.pw-trophies { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.pw-trophy { background: var(--panel); border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; border: 1px solid var(--line); }
.pw-trophy .pw-stat-val { font-size: 36px; color: var(--silver); }
.pw-trophy p { margin: 0; color: var(--muted); font-size: 13.5px; }

/* Detroit numbers */
.pw-fun { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.pw-fun-item { background: var(--panel); border-radius: 12px; padding: 16px; display: grid; gap: 8px; align-content: start; }
.pw-fun-item .pw-stat-val { font-size: 38px; color: var(--blue-hi); }
.pw-fun-item p { margin: 0; color: var(--muted); font-size: 14px; }
.pw-meter { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.pw-meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--blue-hi)); }

/* Box score (log) */
.pw-table-wrap { overflow-x: auto; background: var(--panel); border-radius: 12px; }
.pw-table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 640px; }
.pw-table th { text-align: left; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 12px 12px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.pw-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pw-table tr:last-child td { border-bottom: 0; }
.pw-table td.r, .pw-table th.r { text-align: right; }
.pw-tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; padding: 2px 6px; border-radius: 4px; margin-left: 6px; vertical-align: 1px; }
.pw-tag.am { background: rgba(0,118,182,.25); color: var(--blue-hi); }
.pw-tag.pm { background: rgba(176,183,188,.16); color: var(--silver); }
.pw-tag.best { background: rgba(76,195,138,.18); color: var(--good); }
.pw-row-btns { display: flex; gap: 6px; justify-content: flex-end; }
.pw-link { background: none; border: 0; color: var(--blue-hi); font: 600 13px var(--f-body); cursor: pointer; padding: 4px 2px; }
.pw-link.danger { color: var(--bad); }

/* Add-a-walk panel */
.pw-add { background: var(--panel); border: 1px solid var(--blue); border-radius: 14px; padding: 18px; display: grid; gap: 16px; }
.pw-add-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.pw-drop { border: 2px dashed var(--line); border-radius: 12px; padding: 22px 16px; text-align: center; display: grid; gap: 8px; justify-items: center; cursor: pointer; transition: border-color .15s, background .15s; }
.pw-drop:hover, .pw-drop.over { border-color: var(--blue-hi); background: rgba(0,118,182,.08); }
.pw-drop b { font-family: var(--f-display); font-size: 22px; letter-spacing: .04em; text-transform: uppercase; }
.pw-drop span { color: var(--muted); font-size: 14px; }
.pw-drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.pw-preview { display: flex; gap: 14px; align-items: center; }
.pw-preview img { width: 72px; height: 96px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.pw-status { font-size: 14px; color: var(--muted); }
.pw-status.err { color: var(--bad); } .pw-status.ok { color: var(--good); }
.pw-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.pw-field-in { display: grid; gap: 4px; }
.pw-field-in label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pw-field-in input, .pw-field-in select { font: 500 16px var(--f-body); color: var(--fg); background: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0; }
.pw-field-in input:focus, .pw-field-in select:focus { outline: 2px solid var(--blue-hi); outline-offset: 0; border-color: transparent; }
.pw-field-in .hint { font-size: 12px; color: var(--muted); }
.pw-form-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.pw-foot { color: var(--muted); font-size: 13px; display: grid; gap: 6px; max-width: 80ch; }
.pw-foot p { margin: 0; }

@media (max-width: 520px) {
  .pw-stat-val { font-size: 36px; }
  .pw-bar-row { grid-template-columns: 80px 1fr 56px; }
}
@media (prefers-reduced-motion: reduce) { .pw-drop { transition: none; } }
</style>

<template id="pw-tpl" data-keep>
<div class="pw-wrap">
  <header class="pw-head">
    <div>
      <div class="pw-eyebrow" id="pw-eyebrow">Season stats</div>
      <h1 class="pw-title">Popz <span>Walks</span></h1>
      <p class="pw-sub">Every walk from the watch, turned into a game-day stat sheet: what's working, what to push on, and how far he's really gone.</p>
    </div>
    <div class="pw-actions">
      <span class="pw-chip" id="pw-mode" hidden>View only</span>
      <button class="pw-btn" id="pw-open-add" type="button" hidden>+ Add a walk</button>
    </div>
  </header>
  <div class="pw-stripe" aria-hidden="true"></div>

  <section class="pw-add" id="pw-add" hidden aria-labelledby="pw-add-title">
    <div class="pw-add-head">
      <div>
        <h2 class="pw-h2" id="pw-add-title">Add a walk<small id="pw-add-sub">Drop in a photo or screenshot of the watch's Paused screen or the Fitness summary. Claude reads the numbers; you check them and save.</small></h2>
      </div>
      <button class="pw-btn ghost small" id="pw-close-add" type="button">Close</button>
    </div>
    <label class="pw-drop" id="pw-drop">
      <input type="file" id="pw-file" accept="image/*">
      <b>Choose a screenshot</b>
      <span>or drag it here, or paste it (Ctrl/Cmd + V)</span>
    </label>
    <div class="pw-preview" id="pw-preview" hidden>
      <img id="pw-preview-img" alt="Uploaded walk screenshot">
      <div class="pw-status" id="pw-status" role="status" aria-live="polite"></div>
    </div>
    <div class="pw-status" id="pw-status2" role="status" aria-live="polite" hidden></div>
    <form id="pw-form" class="pw-form" novalidate>
      <div class="pw-field-in"><label for="f-date">Date</label><input id="f-date" type="date" required></div>
      <div class="pw-field-in"><label for="f-clock">Clock on watch</label><input id="f-clock" placeholder="2:51" inputmode="numeric"></div>
      <div class="pw-field-in"><label for="f-period">Morning or afternoon</label><select id="f-period"><option value="AM">Morning (AM)</option><option value="PM">Afternoon / evening (PM)</option></select></div>
      <div class="pw-field-in"><label for="f-dur">Workout time</label><input id="f-dur" placeholder="27:32" required><span class="hint">mm:ss</span></div>
      <div class="pw-field-in"><label for="f-dist">Miles</label><input id="f-dist" placeholder="2.00" inputmode="decimal" required></div>
      <div class="pw-field-in"><label for="f-pace">Average pace</label><input id="f-pace" placeholder="13:40"><span class="hint">min:sec per mile, blank to work it out</span></div>
      <div class="pw-field-in"><label for="f-cal">Active calories</label><input id="f-cal" placeholder="217" inputmode="numeric"></div>
      <div class="pw-field-in"><label for="f-hr">Heart rate on screen</label><input id="f-hr" placeholder="122" inputmode="numeric"></div>
      <div class="pw-field-in"><label for="f-avghr">Avg heart rate</label><input id="f-avghr" placeholder="optional" inputmode="numeric"></div>
      <div class="pw-field-in"><label for="f-elev">Elevation gain (ft)</label><input id="f-elev" placeholder="optional" inputmode="numeric"></div>
    </form>
    <div class="pw-form-actions">
      <button class="pw-btn" id="pw-save" type="button">Save walk</button>
      <button class="pw-btn ghost" id="pw-reset" type="button">Clear</button>
      <span class="pw-status" id="pw-save-status" role="status" aria-live="polite"></span>
    </div>
  </section>

  <section class="pw-sec" aria-labelledby="pw-latest-h">
    <h2 class="pw-h2" id="pw-latest-h">Latest walk<small id="pw-latest-sub">Compared with his average on every other walk</small></h2>
    <div class="pw-board">
      <div class="pw-board-top"><b id="pw-latest-date">—</b><span id="pw-latest-rank">—</span></div>
      <div class="pw-board-grid">
        <div class="pw-stat"><span class="pw-stat-label">Time</span><span class="pw-stat-val pw-num" id="pw-l-dur">—</span><span class="pw-delta" id="pw-l-dur-d"></span></div>
        <div class="pw-stat"><span class="pw-stat-label">Pace / mile</span><span class="pw-stat-val pw-num" id="pw-l-pace">—</span><span class="pw-delta" id="pw-l-pace-d"></span></div>
        <div class="pw-stat"><span class="pw-stat-label">Distance</span><span class="pw-stat-val pw-num" id="pw-l-dist">—</span><span class="pw-delta flat" id="pw-l-dist-d"></span></div>
        <div class="pw-stat"><span class="pw-stat-label">Active cal</span><span class="pw-stat-val pw-num" id="pw-l-cal">—</span><span class="pw-delta" id="pw-l-cal-d"></span></div>
        <div class="pw-stat"><span class="pw-stat-label" id="pw-l-hr-lab">Heart rate</span><span class="pw-stat-val pw-num" id="pw-l-hr">—</span><span class="pw-delta flat" id="pw-l-hr-d"></span></div>
      </div>
      <div class="pw-board-foot" id="pw-latest-foot"></div>
    </div>
  </section>

  <section class="pw-sec" aria-labelledby="pw-season-h">
    <h2 class="pw-h2" id="pw-season-h">Season totals</h2>
    <div class="pw-totals">
      <div class="pw-tile"><span class="pw-stat-label">Walks</span><span class="pw-stat-val pw-num" id="pw-t-n">—</span><p id="pw-t-n-p"></p></div>
      <div class="pw-tile"><span class="pw-stat-label">Miles</span><span class="pw-stat-val pw-num" id="pw-t-mi">—</span><p id="pw-t-mi-p"></p></div>
      <div class="pw-tile"><span class="pw-stat-label">Time on his feet</span><span class="pw-stat-val pw-num" id="pw-t-time">—</span><p id="pw-t-time-p"></p></div>
      <div class="pw-tile"><span class="pw-stat-label">Active calories</span><span class="pw-stat-val pw-num" id="pw-t-cal">—</span><p id="pw-t-cal-p"></p></div>
      <div class="pw-tile"><span class="pw-stat-label">Average speed</span><span class="pw-stat-val pw-num" id="pw-t-mph">—</span><p id="pw-t-mph-p"></p></div>
    </div>
  </section>

  <section class="pw-sec" aria-labelledby="pw-scout-h">
    <h2 class="pw-h2" id="pw-scout-h">Scouting report<small>What the numbers say, good and bad</small></h2>
    <div class="pw-scout">
      <div class="pw-col"><h3><i class="pw-dot" style="background:var(--good)"></i>Winning</h3><ul id="pw-wins"></ul></div>
      <div class="pw-col"><h3><i class="pw-dot" style="background:var(--warn)"></i>Room to grow</h3><ul id="pw-grow"></ul></div>
      <div class="pw-col"><h3><i class="pw-dot" style="background:var(--bad)"></i>Not so good</h3><ul id="pw-bad"></ul></div>
    </div>
  </section>

  <section class="pw-sec" aria-labelledby="pw-film-h">
    <h2 class="pw-h2" id="pw-film-h">Game film: pace, walk by walk<small>Higher on the field is faster. The dashed blue line is his trend.</small></h2>
    <div class="pw-field">
      <div class="pw-legend"><span><i style="background:var(--blue-hi)"></i>Morning walk</span><span><i style="background:var(--silver)"></i>Afternoon walk</span><span><i class="line"></i>Trend</span><span><i class="goal"></i>Goal: 13'00" a mile</span></div>
      <div id="pw-chart"></div>
      <div class="pw-tip" id="pw-tip" hidden></div>
    </div>
  </section>

  <section class="pw-two">
    <div class="pw-card">
      <h3>Morning vs afternoon</h3>
      <p id="pw-ampm-p"></p>
      <div class="pw-big-diff pw-num" id="pw-ampm-diff">—</div>
      <div class="pw-bar-row"><span class="lab">Morning</span><span class="pw-bar"><i id="pw-am-bar"></i></span><span class="val pw-num" id="pw-am-val">—</span></div>
      <div class="pw-bar-row"><span class="lab">Afternoon</span><span class="pw-bar"><i class="silver" id="pw-pm-bar"></i></span><span class="val pw-num" id="pw-pm-val">—</span></div>
      <p id="pw-ampm-cal"></p>
    </div>
    <div class="pw-card">
      <h3>Mile by mile</h3>
      <p id="pw-split-p"></p>
      <div id="pw-splits"></div>
      <p id="pw-split-note"></p>
    </div>
  </section>

  <section class="pw-sec" aria-labelledby="pw-trophy-h">
    <h2 class="pw-h2" id="pw-trophy-h">Trophy case<small>Personal bests so far</small></h2>
    <div class="pw-trophies" id="pw-trophies"></div>
  </section>

  <section class="pw-sec" aria-labelledby="pw-det-h">
    <h2 class="pw-h2" id="pw-det-h">By Detroit numbers<small>All of his walks added up</small></h2>
    <div class="pw-fun" id="pw-fun"></div>
  </section>

  <section class="pw-sec" aria-labelledby="pw-log-h">
    <h2 class="pw-h2" id="pw-log-h">Box score<small>Every walk logged, newest first</small></h2>

    var lo = Math.floor((Math.min.apply(null, ps.concat([GOAL_PACE])) - 10) / 15) * 15;
    var hi = Math.ceil((Math.max.apply(null, ps) + 10) / 15) * 15;
    function x(i) { return m.l + (n === 1 ? iw / 2 : i * iw / (n - 1)); }
    function y(p) { return m.t + (p - lo) / (hi - lo) * ih; }
    var svg = el("svg", { viewBox: "0 0 " + width + " " + height, width: "100%", role: "img", "aria-label": "Pace for each walk, with trend line and 13-minute goal" }, host);
    // field stripes
    var stripeW = iw / 10;
    for (var s = 0; s < 10; s++) el("rect", { x: m.l + s * stripeW, y: m.t, width: stripeW, height: ih, fill: s % 2 ? "rgba(0,118,182,0.05)" : "rgba(0,118,182,0.10)" }, svg);
    // y grid every 15s
    for (var p = lo; p <= hi; p += 15) {
      el("line", { x1: m.l, x2: m.l + iw, y1: y(p), y2: y(p), stroke: "rgba(176,183,188,0.14)", "stroke-width": 1, fill: "none" }, svg);
      if ((p - lo) % 30 === 0 || hi - lo <= 75) { var t = el("text", { x: m.l - 8, y: y(p) + 4, "text-anchor": "end", fill: "#93a0ab", "font-size": 11, "font-family": "Barlow, sans-serif" }, svg); t.textContent = fmtPace(p); }
    }
    // goal line
    el("line", { x1: m.l, x2: m.l + iw, y1: y(GOAL_PACE), y2: y(GOAL_PACE), stroke: "#4cc38a", "stroke-width": 2, "stroke-dasharray": "6 5", fill: "none" }, svg);
    var gt = el("text", { x: m.l + iw - 4, y: y(GOAL_PACE) - 6, "text-anchor": "end", fill: "#4cc38a", "font-size": 12, "font-weight": 600, "font-family": "Barlow, sans-serif" }, svg); gt.textContent = "GOAL 13'00\"";
    // connecting line
    var d = W.map(function (w, i) { return (i ? "L" : "M") + x(i).toFixed(1) + " " + y(ps[i]).toFixed(1); }).join(" ");
    el("path", { d: d, stroke: "rgba(176,183,188,0.35)", "stroke-width": 1.5, fill: "none" }, svg);
    // trend (least squares)
    if (n >= 3) {
      var xs = W.map(function (_, i) { return i; }), mx = mean(xs), my = mean(ps), num = 0, den = 0;
      xs.forEach(function (xi, i) { num += (xi - mx) * (ps[i] - my); den += (xi - mx) * (xi - mx); });
      var slope = den ? num / den : 0, b0 = my - slope * mx;
      el("line", { x1: x(0), y1: y(b0), x2: x(n - 1), y2: y(b0 + slope * (n - 1)), stroke: "#39a6e6", "stroke-width": 2.5, "stroke-dasharray": "8 6", fill: "none" }, svg);
    }
    // x labels
    var every = Math.ceil(n / Math.max(4, Math.floor(iw / 46)));
    W.forEach(function (w, i) {
      if (i % every && i !== n - 1) return;
      var lt = el("text", { x: x(i), y: height - 8, "text-anchor": "middle", fill: "#93a0ab", "font-size": 11, "font-family": "Barlow, sans-serif" }, svg);
      lt.textContent = fmtDate(w.date) || ("#" + w.seq);
    });
    // points
    var bestIdx = ps.indexOf(Math.min.apply(null, ps));
    W.forEach(function (w, i) {
      var last = i === n - 1;
      if (i === bestIdx) el("circle", { cx: x(i), cy: y(ps[i]), r: 10, fill: "none", stroke: "#4cc38a", "stroke-width": 2 }, svg);
      el("circle", { cx: x(i), cy: y(ps[i]), r: last ? 7 : 5, fill: isAM(w) ? "#39a6e6" : "#b0b7bc", stroke: "#111922", "stroke-width": 2 }, svg);
    });
    var lw = W[n - 1], lab = el("text", { x: x(n - 1) - 10, y: y(ps[n - 1]) - 12, "text-anchor": "end", fill: "#f3f6f8", "font-size": 12, "font-weight": 600, "font-family": "Barlow, sans-serif" }, svg);
    lab.textContent = "Latest " + fmtPace(ps[n - 1]);
    // hover / tap targets
    var colW = n === 1 ? iw : iw / (n - 1);
    W.forEach(function (w, i) {
      var r = el("rect", { x: x(i) - colW / 2, y: m.t, width: colW, height: ih, fill: "transparent", tabindex: 0 }, svg);
      function show() {
        tip.innerHTML = "";
        var b = document.createElement("b"); b.textContent = fmtPace(ps[i]) + " / mi";
        var l1 = document.createElement("div"); l1.textContent = walkName(w, true) + " · " + (w.clock || "") + " " + (isAM(w) ? "AM" : "PM");
        var l2 = document.createElement("span"); l2.textContent = fmtDur(w.duration) + " for " + w.distance.toFixed(2) + " mi · " + (w.activeCal || "—") + " cal";
        tip.append(b, l1, l2); tip.hidden = false;
        var box = host.getBoundingClientRect(), par = host.parentNode.getBoundingClientRect();
        var scale = box.width / width;
        var px = (x(i) * scale) + (box.left - par.left), py = (y(ps[i]) * scale) + (box.top - par.top);
        var tw = tip.offsetWidth, left = px + 14; if (left + tw > par.width - 6) left = px - tw - 14; if (left < 6) left = 6;
        tip.style.left = left + "px"; tip.style.top = Math.max(6, py - 30) + "px";
      }
      r.addEventListener("pointerenter", show); r.addEventListener("click", show); r.addEventListener("focus", show);
      r.addEventListener("pointerleave", function () { tip.hidden = true; }); r.addEventListener("blur", function () { tip.hidden = true; });
    });
  }
  var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(drawChart, 120); });

  /* ---------- writing: add / edit / remove ---------- */
  var canWrite = false, artifactNS = null, sampleFn = null, canImages = false, editingId = null;

  function buildDocument(newData) {
    var parts = [];
    document.querySelectorAll("[data-keep]").forEach(function (node) {
      if (node.id === "walk-data") {
        var json = JSON.stringify(newData).replace(/</g, "\\u003c");
        parts.push('<script type="application/json" id="walk-data" data-keep>' + json + "<\/script>");
      } else if (node.id === "app") {
        parts.push('<main id="app" data-keep></main>');
      } else {
        parts.push(node.outerHTML);
      }
    });
    var resetEl = document.head && document.head.querySelector("style");
    var reset = resetEl ? resetEl.textContent : ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + "</style></head><body>" + parts.join("\n") + "</body></html>";
  }

  function saveData(newData, statusEl) {
    if (!artifactNS) { statusEl.className = "pw-status err"; statusEl.textContent = "Saving isn't available in this view. Open the dashboard on claude.ai to add walks."; return Promise.resolve(false); }
    statusEl.className = "pw-status"; statusEl.textContent = "Saving…";
    return artifactNS.publish(buildDocument(newData)).then(function () {
      statusEl.className = "pw-status ok"; statusEl.textContent = "Saved. Updating the dashboard…"; return true;
    }).catch(function (e) {
      var code = e && e.code;
      statusEl.className = "pw-status err";
      if (code === "conflict") statusEl.textContent = "Someone else just saved a change. The dashboard is reloading with it; add this walk again after it loads.";
      else if (code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "capability_disabled" || code === "capability_removed") { statusEl.textContent = "This copy is view only. Ask the person who shared it for edit access to add walks."; setReadOnly(); }
      else if (code === "rate_limited") statusEl.textContent = "Too many saves in a row. Wait a minute and try again.";
      else statusEl.textContent = "Couldn't save just now. Try again in a moment.";
      return false;
    });
  }

  function setReadOnly() { canWrite = false; $("pw-open-add").hidden = true; $("pw-mode").hidden = false; $("pw-add").hidden = true; render(); }

  function removeWalk(id, btn) {
    var next = { walks: DATA.walks.filter(function (w) { return w.id !== id; }) };
    var st = document.createElement("span"); st.className = "pw-status"; btn.replaceWith(st);
    saveData(next, st);
  }

  /* form helpers */
  var F = { date: "f-date", clock: "f-clock", period: "f-period", dur: "f-dur", dist: "f-dist", pace: "f-pace", cal: "f-cal", hr: "f-hr", avghr: "f-avghr", elev: "f-elev" };
  function fv(k) { return $(F[k]).value.trim(); }
  function setF(k, v) { $(F[k]).value = v == null ? "" : v; }
  function todayISO() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function resetForm() {
    Object.keys(F).forEach(function (k) { setF(k, ""); });
    setF("date", todayISO()); setF("period", new Date().getHours() < 12 ? "AM" : "PM");
    editingId = null; $("pw-save").textContent = "Save walk";
    $("pw-preview").hidden = true; $("pw-status2").hidden = true; setText("pw-save-status", ""); $("pw-file").value = "";
    $("pw-add-title").firstChild.nodeValue = "Add a walk";
  }
  function openAdd() { $("pw-add").hidden = false; $("pw-add").scrollIntoView({ behavior: "smooth", block: "start" }); }

  function startEdit(id) {
    var w = DATA.walks.find(function (x) { return x.id === id; }); if (!w) return;
    resetForm(); editingId = id;
    $("pw-add-title").firstChild.nodeValue = "Edit walk #" + w.seq;
    setF("date", w.date || ""); setF("clock", w.clock || ""); setF("period", isAM(w) ? "AM" : "PM");
    setF("dur", fmtDur(w.duration)); setF("dist", (w.distance || 0).toFixed(2)); setF("pace", w.pace ? fmtPace(w.pace).replace("'", ":").replace('"', "") : "");
    setF("cal", w.activeCal); setF("hr", w.hr); setF("avghr", w.avgHr); setF("elev", w.elevation);
    $("pw-save").textContent = "Save changes";
    openAdd();
  }

  function onSave() {
    var st = $("pw-save-status");
    var dur = parseClockDur(fv("dur")), dist = parseFloat(fv("dist"));
    if (!(dur > 0)) { st.className = "pw-status err"; st.textContent = "Add the workout time as minutes:seconds, like 27:32."; return; }
    if (!(dist > 0)) { st.className = "pw-status err"; st.textContent = "Add the distance in miles, like 2.00."; return; }
    var pace = parsePace(fv("pace")); if (!(pace > 0)) pace = Math.round(dur / dist);
    function num(k) { var v = parseFloat(fv(k)); return isNaN(v) ? null : Math.round(v); }
    var base = editingId ? DATA.walks.find(function (x) { return x.id === editingId; }) : null;
    var w = Object.assign({}, base || {}, {
      date: fv("date") || null, clock: fv("clock") || null, period: fv("period"),
      duration: Math.round(dur * 100) / 100, distance: Math.round(dist * 100) / 100, pace: Math.round(pace),
      activeCal: num("cal"), hr: num("hr")
    });
    var ah = num("avghr"), ev = num("elev");
    if (ah != null) w.avgHr = ah; else delete w.avgHr;
    if (ev != null) w.elevation = ev; else delete w.elevation;
    if (pendingExtras && !editingId) { if (pendingExtras.totalCal) w.totalCal = pendingExtras.totalCal; if (pendingExtras.splits) w.splits = pendingExtras.splits; if (pendingExtras.effort) w.effort = pendingExtras.effort; }
    var walks = DATA.walks.slice();
    if (base) { walks = walks.map(function (x) { return x.id === base.id ? w : x; }); }
    else {
      var dup = walks.find(function (x) { return Math.abs(x.duration - w.duration) < 1 && Math.abs(x.distance - w.distance) < 0.005; });
      if (dup && !st.dataset.dupOk) { st.className = "pw-status err"; st.textContent = "This looks like " + walkName(dup, false) + ", which is already logged. Press Save again to add it anyway."; st.dataset.dupOk = "1"; return; }
      var maxSeq = walks.reduce(function (a, x) { return Math.max(a, x.seq || 0); }, 0);
      w.seq = maxSeq + 1; w.id = "w" + Date.now().toString(36);
    }
    delete st.dataset.dupOk;
    $("pw-save").disabled = true;
    saveData({ walks: walks.concat(base ? [] : [w]) }, st).then(function () { $("pw-save").disabled = false; });
  }

  /* reading a screenshot with Claude */
  var pendingExtras = null, readCtl = null;
  var PROMPT = [
    "This image is a photo or screenshot of an Apple Watch workout screen (usually the 'Paused' screen of an Outdoor Walk) or the iPhone Fitness app's Workout Details page.",
    "Read the workout numbers exactly as shown. Reply with only one JSON object with these keys:",
    '{"isWorkout": true|false, "date": "YYYY-MM-DD" or null (only if a date is visible), "clock": "h:mm" (the time of day shown at the top of the watch, or the workout start time on the Fitness page) or null,',
    '"durationText": "mm:ss.xx" workout time as shown, "distanceMiles": number, "activeCalories": number or null, "paceText": "m:ss" average pace per mile or null,',
    '"heartRate": number or null (the heart rate number shown next to the heart on the watch), "avgHeartRate": number or null (only from an \'Avg. Heart Rate\' label), "totalCalories": number or null, "elevationFt": number or null, "effort": string or null,',
    '"splits": [{"miles": number, "seconds": number, "hr": number or null}] or null (only from a Splits table; seconds = the split time)}',
    'Example: {"isWorkout": true, "date": null, "clock": "2:51", "durationText": "27:32.14", "distanceMiles": 2.0, "activeCalories": 217, "paceText": "13:40", "heartRate": 122, "avgHeartRate": null, "totalCalories": null, "elevationFt": null, "effort": null, "splits": null}',
    "If the image is not a workout screen, reply {\"isWorkout\": false}."
  ].join("\n");

  function handleFile(file) {
    if (!file || !/^image\//.test(file.type)) return;
    var url = URL.createObjectURL(file);
    $("pw-preview-img").src = url; $("pw-preview").hidden = false;
    var st = $("pw-status");
    if (!sampleFn || !canImages) { st.className = "pw-status"; st.textContent = "Reading screenshots isn't available in this view. Type the numbers from the photo into the boxes below."; return; }
    st.className = "pw-status"; st.textContent = "Reading the numbers… this can take up to a minute.";
    if (readCtl) readCtl.abort(); readCtl = new AbortController();
    sampleFn.json(PROMPT, { images: [file], signal: readCtl.signal }).then(function (r) {
      if (!r || r.isWorkout === false) { st.className = "pw-status err"; st.textContent = "That doesn't look like a workout screen. Try the watch's Paused screen or the Fitness app summary."; return; }
      var keepDate = fv("date");
      if (r.date && /^\d{4}-\d{2}-\d{2}$/.test(r.date)) setF("date", r.date); else setF("date", keepDate || todayISO());
      if (r.clock) { setF("clock", r.clock); var h = parseInt(r.clock, 10); setF("period", h >= 4 && h <= 11 ? "AM" : "PM"); }
      if (r.durationText) { var ds = parseClockDur(r.durationText); if (ds > 0) setF("dur", fmtDur(ds)); }
      if (r.distanceMiles != null) setF("dist", Number(r.distanceMiles).toFixed(2));
      if (r.paceText) setF("pace", String(r.paceText).replace(/[’′']/g, ":").replace(/["”″]/g, ""));
      if (r.activeCalories != null) setF("cal", r.activeCalories);
      if (r.heartRate != null) setF("hr", r.heartRate);
      if (r.avgHeartRate != null) setF("avghr", r.avgHeartRate);
      if (r.elevationFt != null) setF("elev", r.elevationFt);
      pendingExtras = { totalCal: r.totalCalories || null, effort: r.effort || null, splits: Array.isArray(r.splits) && r.splits.length ? r.splits.map(function (s) { return { miles: Number(s.miles), seconds: Number(s.seconds), hr: s.hr != null ? Number(s.hr) : null }; }).filter(function (s) { return s.miles > 0 && s.seconds > 0; }) : null };
      st.className = "pw-status ok"; st.textContent = "Got it. Check the numbers below, fix anything that's off, then press Save walk.";
    }).catch(function (e) {
      var code = e && e.code; st.className = "pw-status err";
      if (code === "cancelled") { st.textContent = ""; return; }
      if (code === "not_granted") st.textContent = "Reading screenshots needs permission. You can still type the numbers in below.";
      else if (code === "rate_limited") st.textContent = "Too many reads in a row. Wait a minute, or type the numbers in below.";
      else if (code === "image_rejected") st.textContent = "That image couldn't be read. Try a JPEG or PNG screenshot.";
      else st.textContent = "Couldn't read that one. Type the numbers in below, or try a clearer photo.";
    });
  }

  function wireAdd() {
    $("pw-open-add").addEventListener("click", function () { resetForm(); openAdd(); });
    $("pw-close-add").addEventListener("click", function () { $("pw-add").hidden = true; if (readCtl) readCtl.abort(); });
    $("pw-reset").addEventListener("click", resetForm);
    $("pw-save").addEventListener("click", onSave);
    $("pw-form").addEventListener("submit", function (e) { e.preventDefault(); onSave(); });
    $("pw-file").addEventListener("change", function (e) { pendingExtras = null; handleFile(e.target.files && e.target.files[0]); });
    var drop = $("pw-drop");
    ["dragenter", "dragover"].forEach(function (t) { drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add("over"); }); });
    ["dragleave", "drop"].forEach(function (t) { drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove("over"); }); });
    drop.addEventListener("drop", function (e) { var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; pendingExtras = null; handleFile(f); });
    document.addEventListener("paste", function (e) {
      if ($("pw-add").hidden) return;
      var items = (e.clipboardData && e.clipboardData.files) || [];
      if (items.length) { e.preventDefault(); pendingExtras = null; handleFile(items[0]); }
    });
  }

  resetForm(); wireAdd(); render();

  /* light up writing where this view allows it */
  if (window.claude && typeof window.claude.use === "function") {
    Promise.all([
      window.claude.use("artifact").catch(function () { return null; }),
      window.claude.use("sample").catch(function () { return null; }),
      window.claude.use("user").catch(function () { return null; })
    ]).then(function (res) {
      artifactNS = res[0]; sampleFn = res[1]; var user = res[2];
      var editP = user && user.canEdit ? user.canEdit().catch(function () { return null; }) : Promise.resolve(artifactNS ? null : false);
      var limP = sampleFn && sampleFn.limits ? sampleFn.limits().catch(function () { return null; }) : Promise.resolve(null);
      return Promise.all([editP, limP]);
    }).then(function (r) {
      var editable = r[0]; canImages = !!(r[1] && r[1].images);
      if (artifactNS && editable !== false) {
        canWrite = true; $("pw-open-add").hidden = false; $("pw-mode").hidden = true;
        if (!canImages) setText("pw-add-sub", "Type in the numbers from the watch's Paused screen or the Fitness summary, then save.");
        render();
      } else { $("pw-mode").hidden = false; }
    });
  } else { $("pw-mode").hidden = false; }
})();
</script>
